name: OneStage Angular quality

# Push to main only, and not a required check (decision recorded in #23).
on:
  push:
    branches: [main]

permissions: {contents: read}

jobs:
  quality:
    # Central reusable workflow, pinned to a reviewed full commit SHA.
    uses: nus-mtech-grp1-sem2/onestage-ai-engineering/.github/workflows/angular-quality.yml@7dc8ac91aa68cee4cabac1720377814580603496
    with:
      node-version: '24'
      install-command: npm ci
      lint-command: npm run lint
      # Source only: .claude/, .agents/, AGENTS.md and CLAUDE.md are generated by the
      # central sync tool and must not be hand-formatted.
      format-command: npx prettier --check src e2e playwright.config.ts eslint.config.js
      test-command: npm test -- --watch=false
      build-command: npm run build
      audit-command: npm audit --omit=dev
