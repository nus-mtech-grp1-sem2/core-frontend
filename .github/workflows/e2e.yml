name: E2E (mocked API)

# Push to main only, and not a required check (decision recorded in #26). The full-stack
# tier (#25) will be added here as a separate weekly/manual job.
on:
  push:
    branches: [main]

permissions: {contents: read}

jobs:
  mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Chromium plus the system libraries it needs on a fresh runner.
      - run: npx playwright install --with-deps chromium
      # CI=true is set by Actions: forbidOnly, 2 retries, 2 workers, GitHub reporter.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
